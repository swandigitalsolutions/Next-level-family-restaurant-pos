<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orders & Bills — Next Level Family Restaurant</title>
<link rel="icon" href="../assets/brand/next-level-logo.jpeg" />
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/orders.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebarMount"></aside>

  <div class="main-area">
    <header class="topbar">
      <h1>Orders &amp; Bills</h1>
      <div class="user-chip" id="userChip"></div>
    </header>

    <main class="content">
      <div class="panel">
        <div class="orders-toolbar">
          <input type="search" id="searchBox" placeholder="Search by bill no. or customer..." />
          <select id="typeFilter">
            <option value="all">All Types</option>
            <option value="FOOD">Food</option>
            <option value="ALCOHOL">Alcohol</option>
          </select>
          <input type="date" id="dateFilter" />
          <button class="btn btn-outline btn-sm" id="clearFiltersBtn">Clear Filters</button>
          <span class="toolbar-spacer"></span>
          <div class="export-controls" id="exportControls" hidden>
            <input type="date" id="exportFrom" title="From date" />
            <input type="date" id="exportTo" title="To date" />
            <button class="btn btn-outline btn-sm" id="exportCsvBtn">Export CSV</button>
          </div>
        </div>

        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Bill No.</th>
                <th>Type</th>
                <th>Customer</th>
                <th>Date</th>
                <th>Amount</th>
                <th>Payment</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="ordersBody">
              <tr class="skel-row"><td colspan="8"><div class="skel skel-line" style="width:96%"></div></td></tr>
              <tr class="skel-row"><td colspan="8"><div class="skel skel-line" style="width:88%"></div></td></tr>
              <tr class="skel-row"><td colspan="8"><div class="skel skel-line" style="width:92%"></div></td></tr>
              <tr class="skel-row"><td colspan="8"><div class="skel skel-line" style="width:80%"></div></td></tr>
            </tbody>
          </table>
        </div>
        <div id="ordersEmpty" class="empty-state" style="display:none;">No orders found</div>
        <div class="orders-pager">
          <button class="btn btn-outline btn-sm" id="ordersPrevBtn">← Newer</button>
          <span id="ordersPageInfo"></span>
          <button class="btn btn-outline btn-sm" id="ordersNextBtn">Older →</button>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- View Bill Modal -->
<div class="modal-overlay" id="viewModal">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="viewModalTitle">Bill Details</h2>
      <span class="close-x" id="closeViewModalBtn">&times;</span>
    </div>
    <div class="modal-body" id="viewModalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="closeViewBtn">Close</button>
      <button class="btn btn-primary" id="printViewBtn">Print</button>
    </div>
  </div>
</div>

<div id="printArea"></div>

<script src="../js/page-gate.js"></script>
  <script type="module" src="../js/common.js"></script>
<script type="module" src="../js/orders.js"></script>
</body>
</html>
